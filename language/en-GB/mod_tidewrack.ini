; Images
MOD_TIDEWRACK_SHRINKRAY_NOTE="Pairs nicely with <strong>ShrinkRay</strong> (plg_system_shrinkray). When its resized WebP copies exist, Tidewrack adds a responsive srcset so cards load small images on small screens. Set ShrinkRay's Size By to Width. Image fallback order: intro image, full-text image, first image in the article, then a colour gradient."
MOD_TIDEWRACK_SRCSET_LABEL="ShrinkRay srcset"
MOD_TIDEWRACK_SRCSET_DESC="Look for ShrinkRay copies named like photo--333.webp and add them as a srcset."
MOD_TIDEWRACK_SRCSETSIZES_LABEL="Only These Widths"
MOD_TIDEWRACK_SRCSETSIZES_DESC="Optional. Leave empty to use every ShrinkRay copy found for each image. Or list widths to use only those, comma-separated, e.g. 333,666,1000."
MOD_TIDEWRACK_SRCSETFOLDER_LABEL="ShrinkRay Output Folder"
MOD_TIDEWRACK_SRCSETFOLDER_DESC="The Output Folder set in ShrinkRay, relative to the site root (ShrinkRay's default is images/_sized). Only images inside the images folder have copies."


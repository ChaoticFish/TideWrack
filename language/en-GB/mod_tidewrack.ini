; Images
MOD_TIDEWRACK_SHRINKRAY_NOTE="Pairs nicely with <strong>ShrinkRay</strong> (plg_system_shrinkray). When its resized WebP copies exist, Tidewrack adds a responsive srcset so cards load small images on small screens. Set ShrinkRay's Size By to Width. Image fallback order: intro image, full-text image, first image in the article, then the No-Image Art."
